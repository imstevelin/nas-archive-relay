name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: bash -n server/install.sh scripts/*.sh
      - run: go build -o "$RUNNER_TEMP/nas-relay-host" ./cmd/nas-relay
        working-directory: server
      - run: python3 server/install_test.py "$RUNNER_TEMP/nas-relay-host"
      - run: bash scripts/build-server.sh
  client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path client
      - run: UNIVERSAL=1 bash scripts/build-client.sh
